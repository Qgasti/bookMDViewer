<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Viewer</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="toolbar">
      <button id="sidebar-toggle" class="icon-btn" title="切換檔案瀏覽器 (Ctrl+B)" aria-label="Toggle file browser">🗂</button>
      <button id="open-btn" class="icon-btn" title="Open file (Ctrl+O)" aria-label="Open file">📂</button>
      <button id="font-dec" class="icon-btn" title="Decrease font (Ctrl+-)" aria-label="Decrease font size">A−</button>
      <button id="font-inc" class="icon-btn" title="Increase font (Ctrl++)" aria-label="Increase font size">A+</button>
      <button id="save-btn" title="Save (Ctrl+S)" aria-label="Save" hidden>💾 Save</button>
      <button id="export-btn" title="Export to HTML" aria-label="Export to HTML">⬇ HTML</button>
      <button id="edit-toggle" title="Toggle edit mode (Ctrl+E)" aria-label="Toggle edit mode">✎ Edit</button>
      <button id="toc-toggle" title="Toggle outline (Ctrl+\)" aria-label="Toggle outline">☰</button>
      <button id="settings-btn" class="icon-btn" title="設定" aria-label="Settings">⚙</button>
    </div>
    <div id="toast" hidden></div>
    <div id="find-bar" hidden>
      <input id="find-input" type="text" placeholder="Find…" spellcheck="false" />
      <span id="find-count"></span>
      <button id="find-prev" title="Previous (Shift+Enter)" aria-label="Previous match">↑</button>
      <button id="find-next" title="Next (Enter)" aria-label="Next match">↓</button>
      <button id="find-close" title="Close (Esc)" aria-label="Close find">✕</button>
    </div>
    <div id="layout">
      <div id="sidebar" hidden>
        <div class="sidebar-header">
          <button id="folder-btn" class="sidebar-icon-btn" title="選擇工作資料夾">📁</button>
          <span id="sidebar-folder-name" class="sidebar-folder-name" title="">（未選擇資料夾）</span>
          <button id="new-file-btn" class="sidebar-icon-btn" title="新建檔案">＋</button>
        </div>
        <div id="file-list"></div>
      </div>
      <nav id="toc" aria-label="Table of contents"></nav>
      <textarea
        id="editor"
        spellcheck="false"
        placeholder="Markdown source…"
      ></textarea>
      <article id="content" class="markdown-body">
        <div class="empty-state">
          <h1>Markdown Viewer</h1>
          <p>Drag a <code>.md</code> file here, or <a id="empty-open" href="#">open one</a>.</p>
          <div id="recent-list"></div>
        </div>
      </article>
    </div>

    <div id="settings-modal" hidden>
      <div class="modal-box settings-box">
        <h2>設定</h2>
        <div class="settings-row">
          <label for="shortcut-input">Quick Note 快捷鍵</label>
          <div class="shortcut-field">
            <input id="shortcut-input" type="text" readonly placeholder="點擊後按下快捷鍵…" />
            <button id="shortcut-reset" title="還原預設 (Ctrl+Shift+N)">還原</button>
          </div>
          <p class="settings-hint">點擊輸入框，然後按下想要的按鍵組合（需包含 Ctrl/Shift/Alt 修飾鍵）</p>
        </div>
        <div class="modal-actions">
          <button id="settings-save">套用</button>
          <button id="settings-cancel">取消</button>
        </div>
      </div>
    </div>

    <div id="close-modal" hidden>
      <div class="modal-box">
        <p>有未存檔的變更,要在關閉前儲存嗎?</p>
        <div class="modal-actions">
          <button id="modal-save">儲存並關閉</button>
          <button id="modal-discard">不儲存關閉</button>
          <button id="modal-cancel">取消</button>
        </div>
      </div>
    </div>
  </body>
</html>
